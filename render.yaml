services:
  - type: web
    name: tractap-api
    runtime: docker
    rootDir: api.eunic.co.za
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: YOUR_CLIENT_ID.apps.googleusercontent.com
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: TRACTAP
      - key: DEBUG
        value: "false"
